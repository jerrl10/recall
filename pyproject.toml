[project]
name = "recall"
version = "0.1.0"
description = "Long-term engineering memory for AI coding assistants"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
