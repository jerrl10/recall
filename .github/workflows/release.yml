name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv sync --locked
          tag="${GITHUB_REF_NAME#v}"
          package=$(uv run python -c "import recall; print(recall.__version__)")
          if [ "$tag" != "$package" ]; then
            echo "Tag $tag does not match package version $package" >&2
            exit 1
          fi

      - name: Test before publishing anything
        run: uv run pytest

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/obsidian-recall
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity directly,
      # so no long-lived API token is stored as a repository secret.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
